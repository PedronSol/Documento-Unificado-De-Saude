name: CI - Testes Automáticos

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  testes-backend:
    name: Rodar Testes do Backend (pytest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: passaporte_saude
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python
        run: pip install -r backend/requirements.txt

      - name: Aplicar migrations e dados de desenvolvimento
        working-directory: backend
        env:
          APP_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          python -m database_tasks migrate ../db/alembic.ini
          python -m database_tasks seed ../db/seeds/development.sql

      - name: Rodar testes com pytest
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          RUN_DB_INTEGRATION: "1"
        run: pytest -v

  testes-frontend:
    name: Rodar Testes do Frontend (Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright e dependências do sistema
        run: npx playwright install --with-deps chromium

      - name: Rodar testes Playwright
        run: npm test

      - name: Validar build de produção
        run: npm run build

      - name: Upload do relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
